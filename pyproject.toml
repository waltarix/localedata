[project]
name = "localedata"
version = "0.1.0"
description = ""
authors = [
    {name = "nobody", email = "nobody@nowhere"},
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "Jinja2>=3.1.6",
]

[tool.uv]
dev-dependencies = [
    "pyright>=1.1.403",
    "yapf>=0.43.0",
    "isort>=6.0.1",
    "pytest>=8.4.1",
    "pytest-picked>=0.5.1",
    "pytest-testmon>=2.1.3",
    "toml>=0.10.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-rA"
testpaths = ["tests"]

[tool.yapf]
based_on_style = "pep8"
dedent_closing_brackets = true
coalesce_brackets = true
blank_line_before_nested_class_or_def = true
column_limit = 120

[tool.isort]
combine_as_imports = true
